[project]
name = "gold-production-bot"
version = "0.8.0"
description = "Event-driven algorithmic trading system for XAUUSD on MetaTrader 5."
requires-python = ">=3.12"
dependencies = [
    "MetaTrader5==5.0.4500",
    "pandas==2.2.2",
    "numpy==1.26.4",
    "scipy==1.13.1",
    "requests==2.32.3",
    "python-dotenv==1.0.1",
    "apscheduler==3.10.4",
]

[project.optional-dependencies]
dev = [
    "ruff==0.6.9",
    "mypy==1.11.2",
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
    "types-requests==2.33.0.20260518",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["config*", "storage*", "broker*", "indicators*", "strategy*", "execution*", "risk*", "optimizer*", "backtester*", "analytics*", "news*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "B", "I", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# MetaTrader5 ships no inline type hints or stub package (ADR-0002: the only
# module importing it is broker/mt5_gateway.py). Its call sites are
# immediately converted into our own typed dataclasses (SymbolSpec,
# BrokerPosition), so this does not weaken typing anywhere else.
module = "MetaTrader5"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
