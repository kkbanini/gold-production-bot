[project]
name = "gold-production-bot"
version = "1.0.0rc2"
description = "Event-driven algorithmic trading system for XAUUSD on MetaTrader 5."
requires-python = ">=3.12"
dependencies = [
    "MetaTrader5==5.0.4500",
    "pandas==2.2.2",
    "numpy==1.26.4",
    "scipy==1.13.1",
    "requests==2.32.3",
    "python-dotenv==1.0.1",
    "apscheduler==3.10.4",
]

[project.optional-dependencies]
dev = [
    "ruff==0.6.9",
    "mypy==1.11.2",
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
    "types-requests==2.33.0.20260518",
    # Research-only: trains backtester/ml_signal_model.py's models offline.
    # Never imported by the live bot — its logistic-regression candidate
    # did not clear evaluate_promotion_bar() on real data (CHANGELOG.md),
    # so nothing in monitoring/telegram_bot.py depends on sklearn. If a
    # future run does clear the bar, the plan is to hardcode the fitted
    # coefficients as plain constants there instead of importing sklearn
    # at runtime (see that module's docstring).
    "scikit-learn==1.9.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["config*", "storage*", "broker*", "indicators*", "strategy*", "execution*", "risk*", "optimizer*", "backtester*", "analytics*", "news*", "resilience*", "monitoring*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "B", "I", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# MetaTrader5 ships no inline type hints or stub package (ADR-0002: the only
# module importing it is broker/mt5_gateway.py). Its call sites are
# immediately converted into our own typed dataclasses (SymbolSpec,
# BrokerPosition), so this does not weaken typing anywhere else.
module = "MetaTrader5"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# APScheduler ships no py.typed marker and no types-apscheduler stub
# package exists on PyPI. The only module importing it is
# optimizer/self_learning.py, and its use is confined to
# create_weekend_optimizer_scheduler(), which returns the scheduler object
# as-is rather than threading its internals through other typed code.
module = "apscheduler.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# scikit-learn ships no py.typed marker / official stub package as of the
# pinned 1.9.0. Its only importer is backtester/ml_signal_model.py (an
# offline research module, dev-dependency only — never imported by the
# live bot; see that module's docstring).
module = "sklearn.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
# Phase 11e test-suite reorganization (docs/PRODUCTION_SPEC.md §7): the
# standard/default pytest invocation covers only the fast unit +
# integration suites. tests/chaos/ and tests/stress/ are deliberately
# excluded from this default so the CI pipeline's feedback loop never
# depends on them — run explicitly via `pytest tests/chaos tests/stress`.
testpaths = ["tests/unit", "tests/integration"]

[tool.coverage.run]
source = [
    "config",
    "storage",
    "broker",
    "indicators",
    "strategy",
    "execution",
    "risk",
    "optimizer",
    "news",
    "resilience",
    "monitoring",
]
omit = ["*/__init__.py", "tests/chaos/*", "tests/stress/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
